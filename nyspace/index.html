<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/nyspace/ball.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NY Space · Loading Animation</title>
  </head>
  <body class="theme-space">
    <div id="app" class="single">
      <header>
        <h1>NY SPACE — Loading Animation</h1>
        <p>The mark pops in, the tennis ball drops, bounces and settles as the dot · intro plays once, then loops</p>
      </header>
      <main>
        <section class="panel">
          <div class="stage" id="stage" aria-label="NY Space loading animation"></div>
          <div class="meta">
            <div class="actions">
              <span class="chip" id="chip">intro</span>
              <button type="button" id="replay">Replay</button>
              <a href="/nyspace-loading.json" download="nyspace-loading.json">Download .json</a>
              <a href="/nyspace-logo.svg" download="nyspace-logo.svg">Download .svg</a>
              <a class="crosslink" href="/">← All animations</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/nyspace.js"></script>
  </body>
</html>
