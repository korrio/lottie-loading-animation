<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/pantip/l-idot.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pantip · Loading Animation</title>
  </head>
  <body class="theme-tip">
    <div id="app" class="single">
      <header>
        <h1>Pantip — Loading Animation</h1>
        <p>Learn, Share &amp; Fun · the face pops in, letters follow, the i-dot bounces last · intro plays once, then loops</p>
      </header>
      <main>
        <section class="panel">
          <div class="stage" id="stage" aria-label="Pantip loading animation"></div>
          <div class="meta">
            <div class="actions">
              <span class="chip" id="chip">intro</span>
              <button type="button" id="replay">Replay</button>
              <a href="/pantip-loading.json" download="pantip-loading.json">Download .json</a>
              <a class="crosslink" href="/">← All animations</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pantip.js"></script>
  </body>
</html>
