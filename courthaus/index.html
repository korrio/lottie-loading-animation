<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/courthaus/ball.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>COURTHAUS · Loading Animation</title>
  </head>
  <body class="theme-cream">
    <div id="app" class="single">
      <header>
        <h1>COURTHAUS — Loading Animation</h1>
        <p>Letters pop in, the ball drops &amp; spins · intro plays once, then loops seamlessly</p>
      </header>
      <main>
        <section class="panel">
          <div class="stage" id="stage" aria-label="COURTHAUS loading animation"></div>
          <div class="meta">
            <div class="actions">
              <span class="chip" id="chip">intro</span>
              <button type="button" id="replay">Replay</button>
              <a href="/courthaus-loading.json" download="courthaus-loading.json">Download .json</a>
              <a class="crosslink" href="/">← SPIN BASE animations</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/courthaus.js"></script>
  </body>
</html>
